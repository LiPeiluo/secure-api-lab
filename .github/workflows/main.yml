name: Security CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety
          pip install -r requirements.txt

      - name: Run Bandit (SAST)
        run: |
          # Run the static static code analysis, allowing him to report errors, but a report must be generated.
          bandit -r . -f json -o bandit-report.json || true
          bandit -r . -f screen || true

      - name: Run Safety (SCA)
        run: |
          # Run a dependency library scan to check for known vulnerabilities.
          safety check --json > safety-report.json || true
          safety check || true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
